name: Pubblica su Instagram
on:
  schedule:
    - cron: "*/10 * * * *"   # controlla la coda ogni 10 minuti
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: ig-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pubblica i post in scadenza
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 scripts/ig_publish.py
      - name: Salva lo stato (queue -> published)
        if: always()
        run: |
          git config user.name "imt-bot"
          git config user.email "imt-bot@users.noreply.github.com"
          git add -A queue published
          git diff --cached --quiet || (git commit -m "Pubblicato post da coda" && git push)
