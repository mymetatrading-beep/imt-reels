name: Riempi coda Buffer
on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti ricarica la coda di Buffer
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: buffer-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Carica in Buffer i prossimi post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/buffer_sync.py
      - name: Salva lo stato (queue -> scheduled -> published)
        if: always()
        run: |
          git config user.name "imt-bot"
          git config user.email "imt-bot@users.noreply.github.com"
          git add -A queue scheduled published buffer_channels.json 2>/dev/null || git add -A queue scheduled published
          git diff --cached --quiet || (git commit -m "Aggiornata coda Buffer" && git push)
