name: Rinnova token Instagram
on:
  schedule:
    - cron: "0 3 * * 1"   # ogni lunedi alle 3 UTC
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Rinnova il token (valido altri 60 giorni)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$NEW"
          if [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY"
            echo "Token rinnovato e salvato."
          else
            echo "Token rinnovato (nessun GH_PAT: il secret non e' stato aggiornato)."
          fi
